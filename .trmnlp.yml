# Local preview config for trmnlp (not uploaded to TRMNL).
# Set WASHING_LOCATION="lat,lon" in your environment; it stays out of git.
---
watch:
  - .trmnlp.yml
  - src

custom_fields:
  location: "{{ env.WASHING_LOCATION }}"
  # trmnlp only interpolates env in the polling URL, so these are literal.
  # Try e.g. garden_faces: se, house_height: "3", line_distance: "4".
  garden_faces: none
  house_height: "2"
  line_distance: "6"
  shelter: open

time_zone: Europe/London
transform_runtime: enabled

variables:
  trmnl:
    plugin_settings:
      instance_name: Washing
