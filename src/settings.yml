---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor:
polling_url: 'https://api.open-meteo.com/v1/forecast?latitude={{ location | split: '','' | first | strip }}&longitude={{ location | split: '','' | last | strip }}&timezone=auto&forecast_days=3&wind_speed_unit=mph&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,shortwave_radiation,direct_radiation,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max'
polling_headers:
polling_body:
id: 492254
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_site: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: location
  field_type: lat_lon
  name: Location
  description: Where your washing line is. Search for a town or postcode, or enter "lat,lon".
- keyname: garden_faces
  field_type: select
  name: Back of house faces
  description: The direction the washing-line side of your house faces. Used to work out when the house shades the line and shelters it from wind. Leave as "No house nearby" for no adjustment.
  options:
  - No house nearby: none
  - North: n
  - North-east: ne
  - East: e
  - South-east: se
  - South: s
  - South-west: sw
  - West: w
  - North-west: nw
  default: none
- keyname: house_height
  field_type: select
  name: House height
  options:
  - 1 storey (bungalow): '1'
  - 2 storeys: '2'
  - 2 storeys + loft, or 3 storeys: '3'
  default: '2'
- keyname: line_distance
  field_type: select
  name: Line distance from house
  description: From the back wall to the middle of the line.
  options:
  - 2 m: '2'
  - 4 m: '4'
  - 6 m: '6'
  - 10 m: '10'
  - 15 m or more: '15'
  default: '6'
- keyname: shelter
  field_type: select
  name: Other shelter
  description: Fences, hedges, trees or neighbouring houses around the line.
  options:
  - Open: open
  - Some fences or hedges: some
  - Enclosed garden: enclosed
  default: open
name: Ministry of Meteorology, Laundry & Associated Atmospheric Affairs
description: MMLAAA - when to hang washing out
refresh_interval: 30
