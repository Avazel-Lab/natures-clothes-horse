---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: python
refresh_interval_floor:
polling_url: 'https://api.open-meteo.com/v1/forecast?latitude={{ location | split: '','' | first | strip }}&longitude={{ location | split: '','' | last | strip }}&timezone=auto&past_days=1&forecast_days=3&wind_speed_unit=mph&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,shortwave_radiation,direct_radiation,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max'
polling_headers:
polling_body:
id: 492254
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_site: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: location
  field_type: lat_lon
  name: Location
  description: Where your washing line is. Search for a town or postcode, or enter "lat,lon".
- keyname: line_height
  field_type: select
  name: Washing line height
  description: Height of the line itself; the washing hangs about 0.8 m below it. Decides how much of it a fence or hedge shades and shelters.
  optional: true
  options:
  - 5 ft (1.5 m): '1.5'
  - 5.5 ft (1.7 m): '1.7'
  - 6 ft (1.8 m): '1.8'
  - 6.5 ft (2.0 m): '2.0'
  - 7 ft (2.1 m): '2.1'
  - 7.5 ft (2.3 m): '2.3'
  - 8 ft (2.4 m): '2.4'
  default: '2.0'
- keyname: obstruction_1_type
  field_type: select
  name: Obstruction 1
  optional: true
  conditional_validation:
  - when: none
    hidden:
    - obstruction_1_direction
    - obstruction_1_distance
  description: Anything near the line that blocks sun or wind, such as your house, a fence, a shed or a tree. Add up to three. Houses and full-width fences are treated as running right across; short fence sections, sheds and trees as narrow, so wind and sun get round them.
  options:
  - None: none
  - Fence or wall, full width (~1.8 m): fence
  - Fence or wall, short section (~1.8 m, ~5 m long): fence_section
  - Tall hedge (~3 m): hedge
  - Shed or garage (~2.5 m): shed
  - Bungalow, 1 storey (~5.5 m to ridge): bungalow
  - House, 2 storeys (~8.5 m to ridge): house2
  - House, 3 storeys (~11 m to ridge): house3
  - Tree (~10 m): tree
  default: none
- keyname: obstruction_1_direction
  field_type: select
  optional: true
  name: Obstruction 1 direction
  description: Which way it is from the line (your house is north-west of the line if the garden faces south-east).
  options:
  - North: "n"
  - North-east: ne
  - East: e
  - South-east: se
  - South: s
  - South-west: sw
  - West: w
  - North-west: nw
  default: nw
- keyname: obstruction_1_distance
  field_type: select
  optional: true
  name: Obstruction 1 distance
  description: From the line to the nearest face of it.
  options:
  - 1 m: '1'
  - 2 m: '2'
  - 3 m: '3'
  - 4 m: '4'
  - 5 m: '5'
  - 6 m: '6'
  - 8 m: '8'
  - 10 m: '10'
  - 15 m: '15'
  - 25 m or more: '25'
  default: '4'
- keyname: obstruction_2_type
  field_type: select
  name: Obstruction 2
  optional: true
  conditional_validation:
  - when: none
    hidden:
    - obstruction_2_direction
    - obstruction_2_distance
  options:
  - None: none
  - Fence or wall, full width (~1.8 m): fence
  - Fence or wall, short section (~1.8 m, ~5 m long): fence_section
  - Tall hedge (~3 m): hedge
  - Shed or garage (~2.5 m): shed
  - Bungalow, 1 storey (~5.5 m to ridge): bungalow
  - House, 2 storeys (~8.5 m to ridge): house2
  - House, 3 storeys (~11 m to ridge): house3
  - Tree (~10 m): tree
  default: none
- keyname: obstruction_2_direction
  field_type: select
  optional: true
  name: Obstruction 2 direction
  description: Which way it is from the line (your house is north-west of the line if the garden faces south-east).
  options:
  - North: "n"
  - North-east: ne
  - East: e
  - South-east: se
  - South: s
  - South-west: sw
  - West: w
  - North-west: nw
  default: sw
- keyname: obstruction_2_distance
  field_type: select
  optional: true
  name: Obstruction 2 distance
  description: From the line to the nearest face of it.
  options:
  - 1 m: '1'
  - 2 m: '2'
  - 3 m: '3'
  - 4 m: '4'
  - 5 m: '5'
  - 6 m: '6'
  - 8 m: '8'
  - 10 m: '10'
  - 15 m: '15'
  - 25 m or more: '25'
  default: '4'
- keyname: obstruction_3_type
  field_type: select
  name: Obstruction 3
  optional: true
  conditional_validation:
  - when: none
    hidden:
    - obstruction_3_direction
    - obstruction_3_distance
  options:
  - None: none
  - Fence or wall, full width (~1.8 m): fence
  - Fence or wall, short section (~1.8 m, ~5 m long): fence_section
  - Tall hedge (~3 m): hedge
  - Shed or garage (~2.5 m): shed
  - Bungalow, 1 storey (~5.5 m to ridge): bungalow
  - House, 2 storeys (~8.5 m to ridge): house2
  - House, 3 storeys (~11 m to ridge): house3
  - Tree (~10 m): tree
  default: none
- keyname: obstruction_3_direction
  field_type: select
  optional: true
  name: Obstruction 3 direction
  description: Which way it is from the line (your house is north-west of the line if the garden faces south-east).
  options:
  - North: "n"
  - North-east: ne
  - East: e
  - South-east: se
  - South: s
  - South-west: sw
  - West: w
  - North-west: nw
  default: s
- keyname: obstruction_3_distance
  field_type: select
  optional: true
  name: Obstruction 3 distance
  description: From the line to the nearest face of it.
  options:
  - 1 m: '1'
  - 2 m: '2'
  - 3 m: '3'
  - 4 m: '4'
  - 5 m: '5'
  - 6 m: '6'
  - 8 m: '8'
  - 10 m: '10'
  - 15 m: '15'
  - 25 m or more: '25'
  default: '4'
- keyname: shelter
  field_type: select
  optional: true
  name: General exposure
  description: How sheltered the line is from everything not listed above (neighbours, trees further away). Tweaks wind only.
  options:
  - Open: open
  - Some shelter: some
  - Sheltered: sheltered
  default: open
name: The Ministry of Meteorology, Laundry & Regional Atmospheric Affairs
description: MoMRAAA - when to hang washing out
refresh_interval: 30
